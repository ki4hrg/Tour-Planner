services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourplanner}
      POSTGRES_DB: ${POSTGRES_DB:-tourplanner}
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (data lives in a
      # version-subdir like /18/docker), enabling future pg_upgrade --link.
      # Renamed from the old `pgdata` (v17, mounted at /data) so a fresh volume
      # is created cleanly on every host — the v17 layout can't be reused here.
      - postgres_data:/var/lib/postgresql
    ports:
      # Loopback-only: lets host-run tooling (prisma, dev server) reach the DB
      # without exposing Postgres beyond the host. Host port 5433 avoids
      # clashing with a system Postgres on 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourplanner} -d ${POSTGRES_DB:-tourplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built & pushed by GitHub Actions; compose only pulls it.
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/tour-planner:main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DB lives on the compose network; address it by service name. Built from
      # the POSTGRES_* values so it stays in sync with the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tourplanner}:${POSTGRES_PASSWORD:-tourplanner}@postgres:5432/${POSTGRES_DB:-tourplanner}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3076}
      PORT: "3076"
      # First admin is created via the in-app /setup flow on first run.
      # Optionally pre-seed one instead by setting SEED_ON_START=true plus
      # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD.
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
    ports:
      - "3076:3076"

volumes:
  postgres_data:
